name: Build bili-toolbox

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build with PyAppify
        id: build-app
        uses: ok-oldking/pyappify-action@v1.1.0

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            pyappify_dist/*China*
            pyappify_dist/*Global*
            pyappify_dist/*online*
